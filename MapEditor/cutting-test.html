<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图切图策略测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #38BDF8;
        }
        .section {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #22D3EE;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="number"] {
            width: 100px;
            padding: 6px 10px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #F8FAFC;
        }
        button {
            padding: 8px 16px;
            background: #38BDF8;
            border: none;
            border-radius: 4px;
            color: #0F172A;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #22D3EE;
        }
        .visual-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .visual-box {
            flex: 1;
            min-width: 300px;
        }
        .canvas-wrapper {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }
        canvas {
            border: 1px solid #475569;
            display: block;
            image-rendering: pixelated;
        }
        .info-box {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
        .info-box strong {
            color: #F97316;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border: 1px solid #475569;
            border-radius: 3px;
        }
        .warning {
            background: #7C2D12;
            border-left: 3px solid #F97316;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .success {
            background: #14532D;
            border-left: 3px solid #22C55E;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 地图切图策略测试</h1>

        <div class="section">
            <h2>输入参数</h2>
            <div class="input-group">
                <label>
                    原图宽度:
                    <input type="number" id="imgWidth" value="5000" min="100" step="100">
                    px
                </label>
                <label>
                    原图高度:
                    <input type="number" id="imgHeight" value="4000" min="100" step="100">
                    px
                </label>
                <label>
                    切片大小:
                    <input type="number" id="tileSize" value="512" min="64" step="64">
                    px
                </label>
                <button onclick="calculate()">计算切图</button>
            </div>
        </div>

        <div class="section">
            <h2>切图结果</h2>
            <div id="results" class="info-box"></div>
        </div>

        <div class="section">
            <h2>可视化对比</h2>
            <div class="visual-container">
                <div class="visual-box">
                    <h3 style="color: #F97316;">❌ 旧策略：从左上角开始切</h3>
                    <div class="canvas-wrapper">
                        <canvas id="oldCanvas"></canvas>
                    </div>
                    <div class="warning">
                        黑边出现在<strong>底部</strong>（游戏世界的地面，gridY=0），影响玩家视觉体验
                    </div>
                </div>

                <div class="visual-box">
                    <h3 style="color: #22C55E;">✅ 新策略：从左下角开始切</h3>
                    <div class="canvas-wrapper">
                        <canvas id="newCanvas"></canvas>
                    </div>
                    <div class="success">
                        黑边出现在<strong>顶部</strong>（游戏世界的高处），地面完整
                    </div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #3B82F6;"></div>
                    <span>完整图块 (512x512)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #000;"></div>
                    <span>黑边区域</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #EF4444;"></div>
                    <span>不足512的图像部分</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const imgWidth = parseInt(document.getElementById('imgWidth').value);
            const imgHeight = parseInt(document.getElementById('imgHeight').value);
            const tileSize = parseInt(document.getElementById('tileSize').value);

            const cols = Math.ceil(imgWidth / tileSize);
            const rows = Math.ceil(imgHeight / tileSize);

            const lastColWidth = imgWidth % tileSize || tileSize;
            const lastRowHeight = imgHeight % tileSize || tileSize;

            const hasBlackEdge = lastColWidth < tileSize || lastRowHeight < tileSize;

            // 显示结果
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <strong>原图尺寸:</strong> ${imgWidth} x ${imgHeight} px<br>
                <strong>切片大小:</strong> ${tileSize} x ${tileSize} px<br>
                <strong>切片数量:</strong> ${cols} 列 x ${rows} 行 = ${cols * rows} 块<br>
                <strong>最后一列宽度:</strong> ${lastColWidth} px ${lastColWidth < tileSize ? '(不足，有黑边)' : '(完整)'}<br>
                <strong>最后一行高度:</strong> ${lastRowHeight} px ${lastRowHeight < tileSize ? '(不足，有黑边)' : '(完整)'}<br>
                <strong>是否有黑边:</strong> ${hasBlackEdge ? '是' : '否'}
            `;

            // 绘制可视化
            drawOldStrategy(cols, rows, lastColWidth, lastRowHeight, tileSize);
            drawNewStrategy(cols, rows, lastColWidth, lastRowHeight, tileSize);
        }

        function drawOldStrategy(cols, rows, lastColWidth, lastRowHeight, tileSize) {
            const canvas = document.getElementById('oldCanvas');
            const scale = 40; // 每个格子显示40px
            canvas.width = cols * scale;
            canvas.height = rows * scale;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 从上到下，从左到右绘制
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * scale;
                    const y = row * scale;

                    const isLastCol = col === cols - 1;
                    const isLastRow = row === rows - 1;

                    // 完整图块 - 蓝色
                    if (!isLastCol && !isLastRow) {
                        ctx.fillStyle = '#3B82F6';
                        ctx.fillRect(x, y, scale, scale);
                    }
                    // 最后一行或最后一列 - 可能有黑边
                    else {
                        const w = isLastCol && lastColWidth < tileSize ? lastColWidth / tileSize * scale : scale;
                        const h = isLastRow && lastRowHeight < tileSize ? lastRowHeight / tileSize * scale : scale;

                        // 图像部分 - 红色
                        ctx.fillStyle = '#EF4444';
                        ctx.fillRect(x, y, w, h);

                        // 黑边部分 - 黑色
                        if (w < scale) {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(x + w, y, scale - w, scale);
                        }
                        if (h < scale) {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(x, y + h, scale, scale - h);
                        }
                    }

                    // 网格线
                    ctx.strokeStyle = '#64748B';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, scale, scale);

                    // 文件名 (旧策略: 反转Y)
                    const flippedY = rows - 1 - row;
                    ctx.fillStyle = '#F8FAFC';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${col}_${flippedY}`, x + scale/2, y + scale/2);
                }
            }

            // 标注坐标轴
            ctx.fillStyle = '#F97316';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('gridY=' + (rows-1), 5, 15);
            ctx.fillText('gridY=0 ← 黑边在这里！', 5, canvas.height - 5);
        }

        function drawNewStrategy(cols, rows, lastColWidth, lastRowHeight, tileSize) {
            const canvas = document.getElementById('newCanvas');
            const scale = 40;
            canvas.width = cols * scale;
            canvas.height = rows * scale;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 从下到上，从左到右绘制（但canvas坐标还是从上到下）
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    // canvas坐标系：从上到下
                    const canvasY = (rows - 1 - row) * scale;
                    const x = col * scale;

                    const isLastCol = col === cols - 1;
                    const isLastRow = row === rows - 1; // 对应图片顶部

                    // 完整图块 - 蓝色
                    if (!isLastCol && !isLastRow) {
                        ctx.fillStyle = '#3B82F6';
                        ctx.fillRect(x, canvasY, scale, scale);
                    }
                    // 最后一行（顶部）或最后一列 - 可能有黑边
                    else {
                        const w = isLastCol && lastColWidth < tileSize ? lastColWidth / tileSize * scale : scale;
                        const h = isLastRow && lastRowHeight < tileSize ? lastRowHeight / tileSize * scale : scale;

                        // 黑边在顶部
                        if (isLastRow && h < scale) {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(x, canvasY, scale, scale - h);

                            // 图像部分在底部 - 红色
                            ctx.fillStyle = '#EF4444';
                            ctx.fillRect(x, canvasY + (scale - h), w, h);
                        } else {
                            ctx.fillStyle = '#EF4444';
                            ctx.fillRect(x, canvasY, w, h);
                        }

                        // 右侧黑边
                        if (w < scale && !(isLastRow && lastRowHeight < tileSize)) {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(x + w, canvasY, scale - w, scale);
                        }
                    }

                    // 网格线
                    ctx.strokeStyle = '#64748B';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, canvasY, scale, scale);

                    // 文件名 (新策略: row就是gridY)
                    ctx.fillStyle = '#F8FAFC';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${col}_${row}`, x + scale/2, canvasY + scale/2);
                }
            }

            // 标注坐标轴
            ctx.fillStyle = '#22C55E';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('gridY=' + (rows-1) + ' ← 黑边在这里！', 5, 15);
            ctx.fillText('gridY=0 (地面完整)', 5, canvas.height - 5);
        }

        // 初始化
        calculate();
    </script>
</body>
</html>
