<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>坐标系统测试</title>
    <style>
        body { margin: 20px; font-family: Arial; }
        .info { margin: 10px 0; }
        canvas { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>坐标系统测试 - 左下角为原点</h2>
    <div class="info">
        <strong>说明：</strong>左下角应该显示 (0,0)，右上角显示最大坐标
    </div>
    <canvas id="testCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        
        // 模拟地图尺寸
        const totalCols = 10;
        const totalRows = 8;
        const gridWidth = 60;
        const gridHeight = 50;
        const mapPixelHeight = totalRows * gridHeight; // 400
        
        // 绘制网格和坐标标签
        ctx.strokeStyle = '#ccc';
        ctx.fillStyle = '#333';
        ctx.font = '12px Arial';
        
        for (let gridX = 0; gridX <= totalCols; gridX++) {
            for (let gridY = 0; gridY <= totalRows; gridY++) {
                // 使用左下角坐标系转换为Canvas坐标
                const worldX = gridX * gridWidth;
                const worldY = mapPixelHeight - (gridY + 1) * gridHeight;
                
                // 绘制点
                ctx.fillRect(worldX - 2, worldY - 2, 4, 4);
                
                // 在四个角标注坐标
                if ((gridX === 0 || gridX === totalCols) && (gridY === 0 || gridY === totalRows)) {
                    ctx.fillText(`(${gridX},${gridY})`, worldX + 5, worldY + 15);
                }
            }
        }
        
        // 绘制网格线
        for (let gridX = 0; gridX <= totalCols; gridX++) {
            const worldX = gridX * gridWidth;
            ctx.beginPath();
            ctx.moveTo(worldX, 0);
            ctx.lineTo(worldX, canvas.height);
            ctx.stroke();
        }
        
        for (let gridY = 0; gridY <= totalRows; gridY++) {
            const worldY = mapPixelHeight - (gridY + 1) * gridHeight;
            ctx.beginPath();
            ctx.moveTo(0, worldY);
            ctx.lineTo(canvas.width, worldY);
            ctx.stroke();
        }
        
        // 标注四个角
        ctx.fillStyle = 'red';
        ctx.font = 'bold 16px Arial';
        ctx.fillText('左下角 (0,0)', 10, canvas.height - 10);
        ctx.fillText(`右上角 (${totalCols},${totalRows})`, canvas.width - 150, 20);
    </script>
</body>
</html>
